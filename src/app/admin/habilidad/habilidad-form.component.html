<div class="container mt-4">
  <h2 class="mb-4">{{ isEdit ? 'Editar' : 'Nueva' }} Habilidad</h2>
  <p *ngIf="loading">Cargando...</p>
  <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="save()">
    <div class="mb-3">
      <label class="form-label">Nombre *</label>
      <input type="text" formControlName="nombre" class="form-control" />
    </div>
    <div class="mb-3">
      <label class="form-label">Porcentaje (0-100) *</label>
      <input type="range" formControlName="porcentaje" class="form-range" min="0" max="100" />
      <span class="fw-bold">{{ form.get('porcentaje')?.value }}%</span>
    </div>
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label">Categoría</label>
        <input type="text" formControlName="categoria" class="form-control" placeholder="Ej: Frontend, Backend, Tools" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Orden</label>
        <input type="number" formControlName="orden" class="form-control" />
      </div>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || saving">
      <span *ngIf="saving" class="spinner-border spinner-border-sm me-2"></span>
      Guardar
    </button>
    <a routerLink="/admin/habilidades" class="btn btn-secondary ms-2">Cancelar</a>
  </form>
</div>
