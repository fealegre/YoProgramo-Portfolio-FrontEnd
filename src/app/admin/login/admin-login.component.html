<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-body p-4">
          <h2 class="text-center mb-4">Admin Login</h2>
          <form [formGroup]="loginForm" (ngSubmit)="login()">
            <div class="mb-3">
              <label class="form-label">Usuario</label>
              <input type="text" formControlName="username" class="form-control" placeholder="admin" />
              <small *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="text-danger">
                El usuario es requerido
              </small>
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" formControlName="password" class="form-control" placeholder="********" />
              <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-danger">
                La contraseña es requerida (mín. 4 caracteres)
              </small>
            </div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid || submitting">
              <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2"></span>
              Ingresar
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
