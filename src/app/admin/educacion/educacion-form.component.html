<div class="container mt-4">
  <h2 class="mb-4">{{ isEdit ? 'Editar' : 'Nueva' }} Educación</h2>
  <p *ngIf="loading">Cargando...</p>
  <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="save()">
    <div class="mb-3">
      <label class="form-label">URL Logo</label>
      <input type="text" formControlName="logoUrl" class="form-control" />
    </div>
    <div class="mb-3">
      <label class="form-label">Institución *</label>
      <input type="text" formControlName="institucion" class="form-control" />
    </div>
    <div class="mb-3">
      <label class="form-label">Título *</label>
      <input type="text" formControlName="titulo" class="form-control" />
    </div>
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label">Fecha Inicio</label>
        <input type="text" formControlName="fechaInicio" class="form-control" placeholder="Ej: 2020" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Fecha Fin</label>
        <input type="text" formControlName="fechaFin" class="form-control" placeholder="Ej: 2023" />
      </div>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || saving">
      <span *ngIf="saving" class="spinner-border spinner-border-sm me-2"></span>
      Guardar
    </button>
    <a routerLink="/admin/educacion" class="btn btn-secondary ms-2">Cancelar</a>
  </form>
</div>
