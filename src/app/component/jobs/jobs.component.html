<section id="experience" class="experience-section">
<div class="container-fluid px-4">
    <h2>EXPERIENCIA</h2>
    <p *ngIf="loading" class="text-muted">Cargando...</p>
    <p *ngIf="error" class="text-danger">Error al cargar los datos.</p>
    <p *ngIf="!loading && !error && expList.length === 0" class="text-muted">No hay experiencia cargada.</p>
    <ul class="experience-list">
        <li *ngFor="let exp of expList" class="experience-item">
            <div class="row align-items-center gx-3">
                <div class="col-md-2 col-sm-3 col-4 text-center">
                    <img [src]="exp.logoE" class="experience-logo img-fluid" alt="">
                </div>
                <div class="col-md-10 col-sm-9 col-8">
                    <h5 class="experience-job-title">{{ exp.nombreE }}</h5>
                    <h6 class="experience-position">{{ exp.descripcionE }}</h6>
                </div>
            </div>
        </li>
    </ul>
</div>
</section>
