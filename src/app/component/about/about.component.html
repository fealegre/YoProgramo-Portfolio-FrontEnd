<section id="about" class="about-section py-5">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-6 order-md-1 order-2">
        <div class="about-text pr-md-4">
          <h2>Sobre M&iacute;</h2>
          <p class="lead" *ngIf="persona">{{ persona.titulo }}</p>
          <p *ngIf="persona">{{ persona.bio }}</p>
          <p *ngIf="persona && persona.ubicacion" class="text-muted">
            <i class="fas fa-map-marker-alt"></i> {{ persona.ubicacion }}
          </p>
          <p *ngIf="loading" class="text-muted">Cargando...</p>
          <p *ngIf="error" class="text-danger">Error al cargar los datos.</p>
        </div>
      </div>
      <div class="col-md-6 order-md-2 order-1 text-center text-md-left mb-4 mb-md-0">
        <div class="about-image">
          <img [src]="persona?.img || '../../../assets/img/foto-perfil.jpg'" class="img-fluid rounded-circle shadow-lg"
            alt="Mi Foto" />
        </div>
      </div>
    </div>
  </div>
</section>
